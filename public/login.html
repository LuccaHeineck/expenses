<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

    :root {
      --bg: #f8fafc;        /* slate-50 canvas */
      --card: #ffffff;      /* pure white */
      --text: #0f172a;      /* slate-900 */
      --text-muted: #64748b;/* slate-500 */
      --line: #f1f5f9;      /* slate-100 */
      --primary: #4f46e5;   /* indigo-600 */
      --primary-hover: #4338ca;
      --shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.08), 0 8px 10px -6px rgba(15, 23, 42, 0.08);
      --radius-xl: 16px;    /* rounded-2xl */
      --radius-md: 10px;    /* rounded-xl */
    }

    * {
      box-sizing: border-box;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--bg);
      color: var(--text);
      padding: 16px;
    }

    .card {
      width: min(420px, 94vw);
      background: var(--card);
      border: 1px solid rgba(241, 245, 249, 0.8);
      border-radius: var(--radius-xl);
      padding: 32px;
      box-shadow: var(--shadow);
      position: relative;
      overflow: hidden;
    }

    .intro {
      margin-bottom: 24px;
    }

    h1 {
      margin: 0;
      font-size: 1.5rem;
      font-weight: 600;
      color: var(--text);
      letter-spacing: -0.02em;
    }

    .sub {
      margin: 6px 0 0;
      color: var(--text-muted);
      font-size: 0.875rem;
      line-height: 1.4;
    }

    form {
      display: grid;
      gap: 16px;
    }

    label {
      display: grid;
      gap: 6px;
      color: var(--text-muted);
      font-size: 0.75rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    input {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      outline: none;
      font-size: 0.875rem;
      color: var(--text);
      background-color: #f8fafc;
      transition: all 0.2s ease;
    }

    input:focus {
      border-color: var(--primary);
      background-color: var(--card);
      box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.08);
    }

    button {
      margin-top: 8px;
      border: none;
      border-radius: var(--radius-md);
      padding: 12px 14px;
      color: white;
      background-color: #0f172a; /* slate-900 */
      cursor: pointer;
      font-weight: 500;
      font-size: 0.875rem;
      transition: all 0.2s ease;
    }

    button:hover {
      background-color: #1e293b;
      transform: translateY(-1px);
    }

    button:active {
      transform: scale(0.98);
    }

    #msg {
      margin-top: 14px;
      min-height: 20px;
      color: #ef4444;
      font-size: 0.875rem;
      font-weight: 500;
    }

    .brand {
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
      color: var(--text-muted);
      font-size: 0.75rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      font-weight: 600;
      text-align: center;
    }

    @media (max-width: 560px) {
      .card {
        padding: 24px;
      }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="intro">
      <h1>Entrar</h1>
      <p class="sub">Acesse para gerenciar seus lançamentos financeiros.</p>
    </div>
    <form id="loginForm">
      <div>
        <label>Login
          <input name="login" required />
        </label>
      </div>
      <div>
        <label>Senha
          <input name="senha" type="password" required />
        </label>
      </div>
      <button type="submit">Entrar</button>
    </form>
    <div id="msg"></div>
    <div class="brand">Controle Financeiro</div>
  </main>
  <script src="/app.js"></script>
  <script>
    const form = document.getElementById('loginForm');
    const msg = document.getElementById('msg');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const fd = new FormData(form);
      const body = { login: fd.get('login'), senha: fd.get('senha') };
      try {
        const res = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body), credentials: 'same-origin' });
        if (!res.ok) {
          const err = await res.json();
          msg.textContent = err.error || 'Erro';
          return;
        }
        const user = await res.json();
        sessionStorage.setItem('user', JSON.stringify(user));
        window.location.href = '/app';
      } catch (err) {
        msg.textContent = 'Erro de rede';
      }
    });
  </script>
</body>
</html>
