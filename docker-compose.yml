services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-expenses}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-expenses}
      POSTGRES_DB: ${DB_DATABASE:-expenses}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-expenses} -d ${DB_DATABASE:-expenses}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: ${IMAGE_TAG:-expenses:local}
    build: .
    restart: unless-stopped
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-expenses}
      DB_PASSWORD: ${DB_PASSWORD:-expenses}
      DB_DATABASE: ${DB_DATABASE:-expenses}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      DB_SSL: false
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "npm run db:migrate && node dist/initDb.js && node dist/server.js"

volumes:
  postgres_data: