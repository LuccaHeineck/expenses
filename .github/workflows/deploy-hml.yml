name: Deploy Homolog

on:
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  pull-requests: write

jobs:
  code-quality:
    uses: ./.github/workflows/eslint.yml
    with:
      ref: homolog

  unit-tests:
    uses: ./.github/workflows/tests.yml
    with:
      ref: homolog

  build-and-push:
    name: Buildar e enviar imagem para o GHCR
    runs-on: ubuntu-latest
    needs: [unit-tests, code-quality]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: homolog

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Define o nome do repositório em lowercase
        id: string
        run: |
          echo "repo_lower=${{ github.repository }}" | tr '[:upper:]' '[:lower:]' >> $GITHUB_OUTPUT

      - name: Build e Push da Imagem
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ steps.string.outputs.repo_lower }}:homolog

  # Faz o pull da imagem mais recente e reinicia os containers no ambiente de homologação
  deploy:
    name: Atualizar Homolog
    runs-on: self-hosted
    needs: [build-and-push]
    steps:
      - name: Baixar arquivos do repositório na VM
        uses: actions/checkout@v4
        with:
          ref: homolog

      - name: Mover arquivos para a pasta de Homolog e criar .env
        run: |
          mkdir -p /srv/expenses/homolog/
          cp docker-compose.yml docker-compose.hml.yml /srv/expenses/homolog/

          cd /srv/expenses/homolog

          # Repo convertido para lowercase para GHCR
          REPO_RAW="${{ github.repository }}"            
          REPO_LOWER=${REPO_RAW,,}

          cat > .env << EOF
          IMAGE_TAG=ghcr.io/${REPO_LOWER}:homolog
          PORT=${{ secrets.HOMOLOG_PORT }}
          DB_HOST=${{ secrets.HOMOLOG_DB_HOST }}
          DB_PORT=${{ secrets.HOMOLOG_DB_PORT }}
          DB_USER=${{ secrets.HOMOLOG_DB_USER }}
          DB_PASSWORD=${{ secrets.HOMOLOG_DB_PASSWORD }}
          DB_DATABASE=${{ secrets.HOMOLOG_DB_DATABASE }}
          DB_SSL=false
          SMTP_HOST=${{ secrets.SMTP_HOST }}
          SMTP_PORT=${{ secrets.SMTP_PORT }}
          SMTP_USER=${{ secrets.SMTP_USER }}
          SMTP_PASS=${{ secrets.SMTP_PASS }}
          NODE_ENV=homolog
          EOF
          echo ".env atualizado para homolog"

      - name: Docker Compose Pull & Up
        run: |
          cd /srv/expenses/homolog
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

          docker compose -f docker-compose.yml -f docker-compose.hml.yml pull
          docker compose -f docker-compose.yml -f docker-compose.hml.yml up -d --force-recreate --remove-orphans

  create-pr:
    name: Criar PR para Main
    needs: [deploy]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Baixar arquivos do repositório
        uses: actions/checkout@v4
        with:
          ref: homolog
          fetch-depth: 0 # Garante que o histórico completo seja baixado para comparar as branches

      - name: Criar ou atualizar a Pull Request via GH CLI
        run: |
          # Atualiza as referências locais das branches para comparação gráfica
          git fetch origin main homolog

          # Verifica se o PR já existe
          PR_EXISTS=$(gh pr list --head homolog --base main --json number --jq '.[0].number' 2>/dev/null || echo "")

          if [ -n "$PR_EXISTS" ]; then
            echo "PR já existe (ID: $PR_EXISTS). Atualizando..."
            gh pr edit $PR_EXISTS \
              --title "[Release] Homologação para Produção" \
              --body "Este PR é atualizado automaticamente pelo pipeline de homologação."
          else
            # Se o PR NÃO existe, precisamos ver se há commits novos para não quebrar o comando gh pr create
            COMMITS_AHEAD=$(git rev-list --count origin/main..origin/homolog)

            if [ "$COMMITS_AHEAD" -eq "0" ]; then
              echo "Nenhum commit novo entre homolog e main. Nenhuma PR precisa ser criada."
              exit 0
            fi

            echo "Criando uma nova Pull Request estável..."
            gh pr create \
              --head homolog \
              --base main \
              --title "[Release] Homologação para Produção" \
              --body "## Mudanças prontas para Produção
              Este PR foi gerado automaticamente após o deploy bem-sucedido no ambiente de homologação.
              
              **Por favor, revise os commits e faça o merge apenas quando estiver aprovado.**" \
              --label "release"
          fi
