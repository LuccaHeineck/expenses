name: Deploy Homolog

on:
  workflow_dispatch:

jobs:
  code-quality:
    uses: ./.github/workflows/eslint.yml

  # testes:
  
  deploy:
    runs-on: self-hosted
    needs: [code-quality]
    steps:
      - name: Deploy Homolog
        run: |
          set -e

          cd /srv/expenses/homolog

          git pull origin homolog

          docker compose -f docker-compose.yml -f docker-compose.hml.yml up -d --build
